# Exclude automatically generated Swift files and dependencies
excluded:
  - MeshtasticProtobufs
  - build
  - .build
  - Pods
  - Widgets

line_length: 400

type_name:
  min_length: 1
  max_length:
    warning: 60
    error: 70
  excluded: iPhone # excluded via string
  allowed_symbols: ["_"] # these are allowed in type names
identifier_name:
  min_length: 1
  max_length:
    warning: 60
  allowed_symbols: ["_"] # these are allowed in type names

# TODO: should review
force_try:
  severity: warning # explicitly

# TODO: should review
file_length:
  warning: 3500
  error: 4000

# TODO: should review
cyclomatic_complexity:
  warning: 60
  error: 70
  ignores_case_statements: true

# TODO: should review
function_body_length:
  warning: 200

# TODO: should review
type_body_length:
  warning: 400

# TODO: should review
disabled_rules: # rule identifiers to exclude from running
  - operator_whitespace
  - multiple_closures_with_trailing_closure
  - todo
  - trailing_whitespace
  - trailing_comma
  - comment_spacing
  - opening_brace
  - vertical_whitespace
  - colon
  - syntactic_sugar
  - closure_parameter_position
  - comma
  - blanket_disable_command
  - computed_accessors_order
  - implicit_optional_initialization
  - trailing_newline
  - orphaned_doc_comment
  - unused_closure_parameter
  - void_return
  - non_optional_string_data_conversion
  - empty_enum_arguments
  - redundant_discardable_let
  - redundant_void_return
  - for_where
  - switch_case_alignment
  - optional_data_string_conversion
  - mark
  - superfluous_disable_command
  - shorthand_operator
  - duplicate_conditions
  - force_cast
  - large_tuple
  - function_parameter_count

# TODO: should review
nesting:
  type_level:
    warning: 3

custom_rules: {}
